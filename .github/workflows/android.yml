name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'pop_game_updated.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir project
          unzip -q pop_game_updated.zip -d project
          ls -la project
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"
      - name: Make Gradle wrapper executable
        working-directory: project
        run: chmod +x gradlew
      - name: Build debug APK
        working-directory: project
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCollector-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
